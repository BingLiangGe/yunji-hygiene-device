# 数据源配置
spring:
  # redis 配置
  redis:
    # 地址
    host: 120.25.73.138
    # 端口，默认为6379
    port: 29527
    # 数据库索引
    database: 4
    # 密码
    password: qwer!@#$1234
    # 连接超时时间
    timeout: 50000
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: yjhl_PRD_9527
    url: jdbc:mysql://120.25.73.138:3306/hygiene?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
    hikari:
      # 最大连接池大小
      maximum-pool-size: 30
      # 最小空闲连接数
      minimum-idle: 5
      # 连接池的最大等待时间（毫秒）
      max-lifetime: 1800000 # 30 分钟
      # 连接池中每个连接的最大空闲时间（毫秒）
      idle-timeout: 600000 # 10 分钟
      # 验证连接是否有效的 SQL 查询语句
      connection-test-query: SELECT 1
      # 连接池池化时的连接超时时间（毫秒）
      connection-timeout: 30000 # 30 秒
      # 是否启用连接池的日志
      pool-name: HikariCP
      # 是否启用 JMX (默认启用)
      register-mbeans: false
      # 是否允许通过这个连接池进行自动提交
      auto-commit: true
logging:
  level:
    org:
      hibernate: error
      hibernate.SQL: off
      hibernate.type.descriptor.sql.BasicBinder: off
    org.springframework.orm.jpa: error